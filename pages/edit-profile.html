<link rel="stylesheet" href="assets/profile.css">
<div class="page-container profile-page edit-profile-page">
    <div class="profile-header">
        <button class="profile-nav-button back-button" onclick="navigateTo('profile')" aria-label="Back">
            <img src="assets/icons/back.svg" alt="">
        </button>
        <div class="profile-title">Edit Profile</div>
        <div class="profile-header-spacer"></div>
    </div>

    <div class="profile-content">
        <div class="profile-main-card">
            <div class="profile-avatar-large">
                <img src="assets/icons/user.svg" alt="Profile photo" class="profile-avatar-placeholder">
            </div>
            <button class="secondary-button change-photo-button">Change Photo</button>
        </div>

        <div class="profile-info-card edit-form-card">
            <div class="form-group">
                <label for="edit-name">Username</label>
                <input type="text" id="edit-name" placeholder="Username">
            </div>
            <div class="form-group">
                <label for="edit-email">Email</label>
                <input type="email" id="edit-email" placeholder="Email">
            </div>
            <div class="form-group">
                <label for="edit-location">Location</label>
                <input type="text" id="edit-location" placeholder="Location">
            </div>
        </div>

        <div class="profile-actions">
            <button class="primary-button" id="save-profile">Save Changes</button>
        </div>
    </div>
</div>
