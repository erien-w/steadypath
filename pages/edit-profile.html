<div class="page-container profile-page">
    <div class="profile-header">
        <button class="icon-button back-button" onclick="navigateTo('profile')">
            <span style="font-size: 18px;">←</span>
        </button>
        <div class="profile-title">Edit Profile</div>
        <div style="width: 42px;"></div> <!-- Spacer -->
    </div>

    <div class="profile-main-card">
        <div class="profile-avatar-large" style="display: flex; align-items: center; justify-content: center; background: #eee; font-size: 48px; position: relative;">
            👤
        </div>
        <button class="secondary-button" style="margin-top: 10px; background: #fff5f5; color: #cc0000; border: 1px solid #ffcccc;">Change Photo</button>
    </div>

    <div class="profile-info-card" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="form-group">
            <label style="display: block; font-size: 12px; color: #64748b; margin-bottom: 4px;">Username</label>
            <input type="text" id="edit-name" style="width: 100%; padding: 12px; border: 1px solid #e8edf9; border-radius: 12px;" placeholder="Username">
        </div>
        <div class="form-group">
            <label style="display: block; font-size: 12px; color: #64748b; margin-bottom: 4px;">Email</label>
            <input type="email" id="edit-email" style="width: 100%; padding: 12px; border: 1px solid #e8edf9; border-radius: 12px;" placeholder="Email">
        </div>
        <div class="form-group">
            <label style="display: block; font-size: 12px; color: #64748b; margin-bottom: 4px;">Location</label>
            <input type="text" id="edit-location" style="width: 100%; padding: 12px; border: 1px solid #e8edf9; border-radius: 12px;" placeholder="Location">
        </div>
    </div>

    <div style="margin: 20px;">
        <button class="primary-button" id="save-profile" style="background: linear-gradient(135deg, #cc0000 0%, #880000 100%); color: white; border: none; padding: 14px; border-radius: 18px; font-weight: 700;">Save Changes</button>
    </div>
</div>
