<link rel="stylesheet" href="assets/chat.css">
<div class="page-container chat-page">
    <div class="chat-suggestions">
        <button class="suggestion-button" data-message="Can you review my resume?">Review Resume</button>
        <button class="suggestion-button" data-message="What should I focus on next?">Career Tips</button>
        <button class="suggestion-button" data-message="I need wellbeing support.">Wellbeing Help</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-container">
        <div class="input-wrapper">
            <input type="text" class="chat-input" id="chat-input" placeholder="Ask me anything...">
        </div>
        <button class="send-button" id="send-button">
            <span style="color: white; font-size: 18px;">✈️</span>
        </button>
    </div>
</div>
