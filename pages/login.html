<link rel="stylesheet" href="assets/login.css">
<div class="page-container login-page">
    <div class="login-card">
        <div class="login-top">
            <img src="assets/images/steadypath-logo.svg" alt="SteadyPath" class="login-logo">
            <h2>Welcome to SteadyPath</h2>
            <p class="login-sub">Sign in to continue your learning journey.</p>
        </div>

        <div class="login-form">
            <input id="login-username" type="text" placeholder="Username" />
            <input id="login-email" type="email" placeholder="Email" />
            <div class="password-row">
                <input id="login-password" type="password" placeholder="Password" />
                <button id="toggle-password" class="icon-button" aria-label="toggle password"></button>
            </div>
            <button id="login-submit" class="primary-button">Sign in</button>
            <button id="login-guest" class="secondary-button">Continue as guest</button>
        </div>
        <div class="login-foot">
            <small>By continuing you agree to the <a href="#" id="terms-link">Terms & Conditions</a>.</small>
        </div>
    </div>
</div>
