<link rel="stylesheet" href="assets/profile.css">
<div class="page-container profile-page">
    <div class="profile-header">
        <button class="icon-button back-button" onclick="navigateTo('dashboard')">
            <img src="assets/images/icon-back.png" alt="Back">
        </button>
        <div class="profile-title">Profile</div>
        <button class="icon-button edit-button">
            <img src="assets/images/icon-edit.png" alt="Edit">
        </button>
    </div>

    <div class="profile-main-card">
        <img class="profile-avatar-large" src="assets/images/profile-avatar.png" alt="Profile avatar">
        <div class="profile-name">y</div>
        <div class="profile-role-badge">Aspiring Frontend Developer</div>
    </div>

    <div class="profile-info-card">
        <div class="profile-info-row">
            <span>Email</span>
            <strong>alex.johnson@email.com</strong>
        </div>
        <div class="profile-info-row">
            <span>Location</span>
            <strong>San Francisco, CA</strong>
        </div>
        <div class="profile-info-row">
            <span>Joined</span>
            <strong>January 2026</strong>
        </div>
    </div>

    <div class="section-title">Your Stats</div>
    <div class="profile-stats-grid">
        <div class="stat-card small-card">
            <div class="stat-icon">7d</div>
            <div class="stat-body">
                <div class="stat-value">7 days</div>
                <div class="stat-label">Learning Streak</div>
            </div>
        </div>
        <div class="stat-card small-card">
            <div class="stat-icon">12</div>
            <div class="stat-body">
                <div class="stat-value">12</div>
                <div class="stat-label">Courses Done</div>
            </div>
        </div>
        <div class="stat-card small-card">
            <div class="stat-icon">45</div>
            <div class="stat-body">
                <div class="stat-value">45</div>
                <div class="stat-label">Connections</div>
            </div>
        </div>
    </div>

    <div class="section-title">Achievements</div>
    <div class="achievement-card">
        <div class="achievement-avatar">🔥</div>
        <div>
            <div class="achievement-title">Week Warrior</div>
            <div class="achievement-subtitle">7-day check-in streak</div>
        </div>
    </div>
</div>
