<link rel="stylesheet" href="assets/community.css">
<div class="page-container community-page">
    <div class="community-top">
        <div>
            <div class="section-title">Community</div>
            <div class="section-subtitle">Search groups, people and opportunities.</div>
        </div>
    </div>

    <div class="community-search-row">
        <div class="search-input">
            <div class="search-icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <input id="community-search" type="text" placeholder="Search groups, people...">
        </div>
        <button class="filter-button">Filters</button>
    </div>

    <div class="community-tabs">
        <button class="tab-pill active">All</button>
        <button class="tab-pill">Groups</button>
        <button class="tab-pill">People</button>
        <button class="tab-pill">Opportunities</button>
    </div>

    <div class="section-title">Recommended Groups</div>
    <div class="group-card">
        <div class="group-card-row">
            <div>
                <div class="group-card-title">Frontend Developers 2026</div>
                <div class="group-card-info">234 members</div>
            </div>
            <span class="group-match">95% match</span>
        </div>
        <div class="group-tags">
            <span>React</span>
            <span>TypeScript</span>
            <span>UI/UX</span>
        </div>
        <button class="primary-button">Join Group</button>
    </div>

    <div class="group-card">
        <div class="group-card-row">
            <div>
                <div class="group-card-title">Career Switchers Support</div>
                <div class="group-card-info">156 members</div>
            </div>
            <span class="group-match">88% match</span>
        </div>
        <div class="group-tags">
            <span>Career Change</span>
            <span>Mentorship</span>
            <span>Networking</span>
        </div>
        <button class="primary-button">Join Group</button>
    </div>
</div>
