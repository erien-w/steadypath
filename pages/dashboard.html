<link rel="stylesheet" href="assets/dashboard.css">
<div class="page-container dashboard-page">
    <div class="dashboard-header">
        <div>
            <div class="dashboard-greeting">Good afternoon, Alex</div>
            <div class="dashboard-subtitle">Ready to grow today?</div>
        </div>
    </div>

    <div class="card-row">
        <div class="info-card">
            <div class="info-card-top">
                <div class="info-card-badge info-card-badge-blue">W</div>
                <div>
                    <div class="info-card-title">Weather</div>
                </div>
            </div>
            <div class="info-card-value">72°F</div>
            <div class="info-card-note">Partly Cloudy</div>
        </div>
        <div class="info-card mood-card">
            <div class="info-card-top">
                <div class="info-card-badge info-card-badge-pink">M</div>
                <div>
                    <div class="info-card-title">Today's Mood</div>
                </div>
            </div>
            <div class="mood-row">
                <span>😊</span>
                <span>😐</span>
                <span>😟</span>
            </div>
        </div>
    </div>

    <div class="section-title">Quick Actions</div>
    <div class="quick-action-list">
        <button class="quick-action-card large-card" data-page="career">
            <div class="quick-action-icon quick-action-blue">
                <img src="assets/icons/career.svg" alt="Career Path">
            </div>
            <div class="quick-action-copy">
                <div class="quick-action-title">Career Path</div>
                <div class="quick-action-subtitle">Resume analysis & skill recommendations</div>
            </div>
            <div class="quick-action-arrow">→</div>
        </button>
        <div class="quick-action-row">
            <button class="quick-action-card" data-page="wellbeing">
                <div class="quick-action-icon quick-action-orange">
                    <img src="assets/icons/wellbeing.svg" alt="Wellbeing">
                </div>
                <div class="quick-action-copy">
                    <div class="quick-action-title">Wellbeing</div>
                    <div class="quick-action-subtitle">Daily check-ins & support chat</div>
                </div>
                <div class="quick-action-arrow">→</div>
            </button>
            <button class="quick-action-card" data-page="community">
                <div class="quick-action-icon quick-action-purple">
                    <img src="assets/icons/community.svg" alt="Community">
                </div>
                <div class="quick-action-copy">
                    <div class="quick-action-title">Community</div>
                    <div class="quick-action-subtitle">Connect with peers & opportunities</div>
                </div>
                <div class="quick-action-arrow">→</div>
            </button>
        </div>
    </div>
</div>
