version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - ask_support
  - resume_upload
  - ask_career_advice
  - ask_course_recommendation

responses:
  utter_greet:
  - text: "Hey, I’m really glad you’re here. I can listen, support you, and help with gentle next steps when you need them."

  utter_cheer_up:
  - text: "I’m sorry you’re feeling this way. Let’s take this one small step at a time together — you don’t have to carry it alone."
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "I’m here with you. Did that feel a little more supportive?"

  utter_happy:
  - text: "That’s really good to hear. I’m proud of you for showing up today."

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Rasa."

  utter_support_info:
  - text: "I can help with practical advice, calm check-ins, wellbeing support, and gentle next steps — like a real friend would."

  utter_resume_received:
  - text: "Resume received! I'm analyzing the skills and career highlight areas now."

  utter_recommend_courses:
  - text: "I can recommend courses tailored to your industry once you upload a resume on the Career Path page."

  utter_mood_ack:
  - text: "Thank you for telling me. I’m glad you reached out, and I’m here to support you one small step at a time."

actions:
  - action_resume_summary
  - action_support_context

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
