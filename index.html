<!DOCTYPE html>
<html>

<head>
    <title>SteadyPath</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="assets/images/steadypath-logo.svg">
    <link rel="stylesheet" href="assets/styles.css">
    <!-- External Libraries for PDF and Image Scanning -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>

<body>
    <div class="app-wrapper">
        <div class="app-container">
            <!-- HEADER -->
            <div class="app-header">
                <div class="header-left">
                    <img class="header-logo" src="assets/images/steadypath-logo.svg" alt="SteadyPath logo">
                    <h1 class="header-title">SteadyPath</h1>
                </div>
                <div class="header-right">
                    <button onclick="navigateTo('profile')" class="icon-button">
                        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- CONTENT AREA -->
            <div class="app-content">
                <!-- Pages load here dynamically -->
            </div>

            <!-- NAVIGATION -->
            <div class="app-nav">
                <button class="nav-item active" onclick="navigateTo('dashboard')" data-page="dashboard">
                    <img class="nav-icon" src="assets/icons/home.svg" alt="Home">
                    <div class="nav-label">Home</div>
                </button>
                <button class="nav-item" onclick="navigateTo('career')" data-page="career">
                    <img class="nav-icon" src="assets/icons/career.svg" alt="Career">
                    <div class="nav-label">Career</div>
                </button>
                <button class="nav-item" onclick="navigateTo('wellbeing')" data-page="wellbeing">
                    <img class="nav-icon" src="assets/icons/wellbeing.svg" alt="Wellbeing">
                    <div class="nav-label">Wellbeing</div>
                </button>
                <button class="nav-item" onclick="navigateTo('community')" data-page="community">
                    <img class="nav-icon" src="assets/icons/community.svg" alt="Community">
                    <div class="nav-label">Community</div>
                </button>
            </div>
        </div>
    </div>

    <script src="assets/resume-analyzer.js"></script>
    <script src="assets/app.js"></script>
</body>

</html>
